<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1F3864">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETNER TEST</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ETNER TEST">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --navy:#1F3864; --navy2:#2C4A80; --orange:#E46C0A; --bg:#F3F5F9; --card:#FFFFFF; --text:#18202C; --muted:#667085;
  --line:#E3E7EE; --soft:#EEF2F8; --ok:#1E7B46; --bad:#C62828; --warn:#B45309; --radius:12px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --tab-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy2)}
#app{display:flex;min-height:100vh}
#side{display:none}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;
  padding:10px 12px;min-height:54px;padding-top:max(10px,env(safe-area-inset-top))}
#top h1{font-size:17px;margin:0;flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .ib{background:transparent;border:0;color:#fff;width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
#top .ib:active{background:rgba(255,255,255,.15)}
#view{flex:1;padding:12px 12px calc(var(--tab-h) + 24px)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
#tabs button .ic{font-size:21px;line-height:1}
#tabs button.on{color:var(--navy);font-weight:600}
.brand{font-weight:800;letter-spacing:.5px}
.brand b{color:var(--orange)}
/* desktop */
@media (min-width:760px){
  #side{display:flex;flex-direction:column;width:220px;flex:0 0 220px;background:var(--navy);color:#fff;
    position:sticky;top:0;height:100vh;padding:16px 10px}
  #side .brand{font-size:22px;padding:6px 10px 18px}
  #side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#D6DEEC;
    padding:11px 12px;border-radius:10px;font-size:15px;cursor:pointer;text-align:left}
  #side button:hover{background:rgba(255,255,255,.08)}
  #side button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
  #side .who{margin-top:auto;font-size:13px;color:#B9C4D8;padding:10px 12px}
  #tabs{display:none}
  #view{padding:18px 22px 40px}
  #top{background:#fff;color:var(--text);border-bottom:1px solid var(--line)}
  #top .ib{color:var(--navy)}
  #top .ib:active{background:var(--soft)}
}
/* elementy */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.b{font-weight:600}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;min-height:42px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;text-decoration:none;color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.acc{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.danger{color:var(--bad);border-color:#F2C4C4}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:#E6EAF1;border-radius:11px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;cursor:pointer;white-space:nowrap;font-size:14px;color:#3D4A5C}
.seg button.on{background:#fff;box-shadow:var(--shadow);font-weight:600;color:var(--navy)}
.seg .cnt{font-size:12px;color:var(--muted);margin-left:4px}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-bottom:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:#E8EDF5;color:#334}
.kat{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:1px 5px;font-size:12px;font-weight:700;
  background:#EEF1F6;color:#334}
.k-E{background:#FFF2CC;color:#7A5B00}.k-RW{background:#DDEBF7;color:#1F4E79}.k-K{background:#DFF3F7;color:#0E6070}
.k-AM{background:#F4E1EA;color:#7B2D55}.k-SH{background:#FBE5D6;color:#8A3B0C}.k-H{background:#E2EFDA;color:#375623}
.k-S{background:#EDEDED;color:#444}.k-I{background:#EDEDED;color:#444}
.st-planowane{background:#DDEBF7;color:#1F4E79}.st-w-realizacji{background:#FCE4CC;color:#8A4100}
.st-do-rozliczenia{background:#EADCF5;color:#5B2C83}.st-na-później{background:#ECECEC;color:#555}
.st-rozliczone{background:#DCF0E3;color:#1E6B3B}.st-anulowane{background:#F8DADA;color:#9B1C1C}
.st-do-wyceny{background:#FCE4CC;color:#8A4100}.st-wycena-wysłana{background:#DDEBF7;color:#1F4E79}
.st-przyjęta{background:#DCF0E3;color:#1E6B3B}.st-odrzucona{background:#F8DADA;color:#9B1C1C}
.list .item{display:block;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;
  cursor:pointer;border:2px solid transparent}
.list .item:hover{border-color:#D5DEEB}
.list .item.sel{border-color:var(--navy2)}
.grp{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 4px 8px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
@media (max-width:420px){.kv{grid-template-columns:105px 1fr}}
h2{font-size:19px;margin:2px 0 4px}
h3{font-size:15px;margin:0 0 10px;color:var(--navy)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fab{position:fixed;right:16px;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));z-index:25;width:56px;height:56px;border-radius:18px;
  border:0;background:var(--orange);color:#fff;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.2);cursor:pointer}
@media (min-width:760px){.fab{display:none}}
.desk{display:none}
@media (min-width:760px){.desk{display:inline-flex}}
.over{color:var(--bad);font-weight:600}
.soon{color:var(--warn);font-weight:600}
/* split */
.split{display:block}
@media (min-width:1100px){
  .split{display:grid;grid-template-columns:minmax(360px,420px) 1fr;gap:18px;align-items:start}
  .split .pane-l{max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
  .split .pane-r{max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
  .split.solo .pane-r{display:block}
}
/* harmonogram */
.htool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.htool .lbl{font-weight:600;min-width:140px;text-align:center}
.day{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.day-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--soft);font-weight:600}
.day.we .day-h{background:#F1F1F1;color:#888}
.day.today{outline:2px solid var(--orange)}
.day.hol .day-h{background:#FDECEC;color:#9B1C1C}
.day-b{padding:6px 12px 10px}
.ent{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.ent:last-child{border-bottom:0}
.chip{display:inline-block;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600;max-width:100%}
.who{font-size:13px;color:var(--muted)}
.c-urlop{background:#DCF0E3;color:#1E6B3B}.c-l4{background:#F8DADA;color:#9B1C1C}.c-wolne{background:#ECECEC;color:#555}
.c-bezplatny{background:#ECECEC;color:#555}.c-zadanie{background:#FFF0C2;color:#7A5300}.c-okol{background:#EADCF5;color:#5B2C83}
.c-txt{background:#EEF1F6;color:#334}
.hgrid-wrap{overflow:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);max-height:calc(100vh - 150px)}
table.hgrid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.hgrid th,.hgrid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 6px;vertical-align:top;min-width:110px}
.hgrid th{position:sticky;top:0;background:#F7F9FC;z-index:2;font-size:12.5px;text-align:left}
.hgrid td.d,.hgrid th.d{position:sticky;left:0;background:#F7F9FC;z-index:1;min-width:92px;white-space:nowrap}
.hgrid th.d{z-index:3}
.hgrid tr.we td{background:#FAFAFA}
.hgrid tr.we td.d{background:#F0F0F0;color:#888}
.hgrid tr.hol td.d{color:#9B1C1C}
.hgrid tr.today td{background:#FFF7EE}
.hgrid tr.today td.d{background:#FFE9D2;font-weight:700}
.hgrid tr.wk td{border-top:3px solid var(--navy)}
.hgrid td.cell{cursor:pointer}
.hgrid td.cell:hover{background:#F0F5FF}
.hgrid .chip{display:block;white-space:normal}
.hgrid td.uw{color:var(--muted);font-style:italic;min-width:160px}
/* dziennik */
.composer textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}
.thumbs .th{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:#E6EAF1;cursor:pointer}
.thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .th .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.entry{border-top:1px solid var(--line);padding:12px 0}
.entry:first-child{border-top:0}
.entry .txt{white-space:pre-wrap;word-break:break-word;margin-top:4px}
.tag{font-size:11px;background:#FFF0C2;color:#7A5300;border-radius:6px;padding:1px 6px;margin-left:6px}
/* pumble */
.msgs{max-height:340px;overflow:auto;background:var(--soft);border-radius:10px;padding:8px}
.msg{background:#fff;border-radius:10px;padding:7px 10px;margin:6px 0;font-size:14px}
.msg .a{font-weight:600;font-size:12.5px;color:var(--navy2)}
.msg .t{float:right;font-size:11.5px;color:var(--muted)}
.msg .x{white-space:pre-wrap;word-break:break-word}
/* formularze */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #D3D9E3;border-radius:10px;padding:10px 11px;background:#fff;min-height:44px}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.search:focus{outline:2px solid #9CB6E0;border-color:#9CB6E0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;
  font-size:14px;color:var(--text);margin:0}
.checks input{width:auto;min-height:0}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer}
/* arkusz (modal) */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(15,23,42,.45);align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:760px){#sheet{align-items:center}#sheet .box{border-radius:16px}}
#sheet .box h3{font-size:17px;color:var(--text);display:flex;align-items:center;justify-content:space-between}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 20px);z-index:60;background:#1F2937;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;display:none;max-width:90vw;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#toast.on{display:block}
#toast.err{background:var(--bad)}
#viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
#viewer.on{display:flex}
#viewer img{max-width:100vw;max-height:88vh;object-fit:contain}
#viewer .vb{position:absolute;background:rgba(255,255,255,.15);border:0;color:#fff;width:48px;height:48px;border-radius:50%;font-size:24px;cursor:pointer}
#viewer .cl{top:14px;right:14px}#viewer .pv{left:10px;top:50%}#viewer .nx{right:10px;top:50%}
#viewer .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#ddd;font-size:13px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid #C9D3E3;border-top-color:var(--navy);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:60vh;color:var(--muted)}
.loading .spin{width:34px;height:34px;border-width:3.5px}
.hide{display:none!important}
.link{background:none;border:0;padding:0;color:var(--navy2);cursor:pointer;text-decoration:underline}
.ok{color:var(--ok)}
.copyfld{display:flex;gap:6px}
.copyfld input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#F9FAFB}
#net{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
#net .pill{background:rgba(255,255,255,.18);color:#fff;display:inline-flex;align-items:center;gap:5px}
#net .pill.off{background:#F8DADA;color:#9B1C1C}
#net .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@media (min-width:760px){#net .pill{background:#EEF2F8;color:var(--navy)}#net .spin{border-color:#C9D3E3;border-top-color:var(--navy)}}
.spin.sm{width:14px;height:14px;border-width:2px}
.item.tmp{opacity:.8;border:2px dashed #C9D3E3}
.entry.tmp{opacity:.75}
.wait{font-size:11.5px;color:var(--warn);font-weight:600;margin-left:6px}
.msg.tmp{opacity:.6}
.btn.install{background:var(--orange);border-color:var(--orange);color:#fff}
/* v2.1 */
#tabs button{position:relative;padding:4px 0 2px;min-width:0}
#tabs button .ic{position:relative;display:inline-flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px;transition:background .15s}
#tabs button .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(9px,2.5vw,11.5px);letter-spacing:-.25px;padding:0 1px}
#tabs button.on{color:var(--navy);font-weight:700}
#tabs button.on .lb{letter-spacing:-.5px}
#tabs button[data-go=harm]{flex:1.3}
#tabs button.on .ic{background:#DCE6F5;box-shadow:inset 0 0 0 1.5px #B7C8E6}
#tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--orange)}
#tabs .dot{position:absolute;top:-3px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;padding:0 4px;font-style:normal}
#side button.on{box-shadow:inset 4px 0 0 var(--orange)}
.contact{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.contact .crow{display:flex;align-items:center;gap:10px;padding:10px 12px;color:var(--text);text-decoration:none;border-top:1px solid var(--line);font-size:14.5px}
.contact .crow:first-child{border-top:0}
.contact a.crow:active{background:var(--soft)}
.contact .ci{font-size:22px;width:30px;text-align:center}
.contact .go{font-size:22px;color:var(--muted)}
.chips{display:inline-flex;flex-wrap:wrap;gap:4px;max-width:55%}
.chip.half{font-size:12.5px}
.dayhead{display:flex;align-items:center;margin:2px 2px 12px}
.dayhead .big{font-size:20px;font-weight:700;color:var(--navy);text-transform:capitalize}
.addin{border:1px solid #D3D9E3;border-radius:10px;padding:10px 11px;min-height:44px;background:#fff;min-width:0}
.chk{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.chk input{width:24px;height:24px;flex:0 0 24px;accent-color:var(--ok)}
.chk .t{display:block;font-size:15.5px}
.chk.done .t{text-decoration:line-through;color:var(--muted)}
.chk.tmp{opacity:.7}
.jcard .sub{margin-top:12px;font-weight:600;font-size:13.5px;color:var(--navy)}
.jcard .mini{padding:6px 0;border-bottom:1px dashed var(--line)}
.jcard .mini:last-child{border-bottom:0}
.pushon{display:flex;align-items:center;gap:12px;background:#FFF7EE;border:1px solid #F6D3B0}
.item.buy.done{opacity:.75}
.st-do-kupienia{background:#FCE4CC;color:#8A4100}.st-zamówione{background:#DDEBF7;color:#1F4E79}.st-kupione{background:#DCF0E3;color:#1E6B3B}
</style>

</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="main">
    <header id="top"><button class="ib hide" id="back" data-act="back" aria-label="Wstecz">‹</button><h1 id="title">ETNER</h1><span id="net"></span><span id="topact"></span></header>
    <div id="view"><div class="loading"><span class="spin"></span><div>Ładowanie danych…</div></div></div>
  </div>
  <nav id="tabs"></nav>
</div>
<div id="sheet"><div class="box" id="sheetbox"></div></div>
<div id="toast"></div>
<div id="viewer"><img id="vimg" alt=""><button class="vb cl" data-act="vclose">✕</button><button class="vb pv" data-act="vprev">‹</button><button class="vb nx" data-act="vnext">›</button><div class="cap" id="vcap"></div></div>
<input type="file" id="filepick" accept="image/*" multiple class="hide">
<script>var BOOT = {};</script>
<script src="config.js"></script>
<script>
(function () {
'use strict';
// ================================================================================================ tryb pracy
// gas = strona z Apps Script (google.script.run), pwa = aplikacja instalowana (fetch do /exec, plik config.js)
var CFG = window.ETNER_CFG || {};
var MODE = (window.google && google.script && google.script.run) ? 'gas' : 'pwa';
var LSK = 'etner2_';
function urlParam(k) { try { return new URLSearchParams(location.search).get(k) || ''; } catch (e) { return ''; } }
function lsGet(k) { try { var v = localStorage.getItem(LSK + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(LSK + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
var TOKEN = String(BOOT.token || urlParam('u') || (MODE === 'pwa' ? (lsGet('token') || '') : '')).trim();

function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function norm(s) { return String(s || '').trim().toLowerCase(); }
function slug(s) { return norm(s).replace(/\s+/g, '-'); }
function pd(iso) { if (!iso) return null; var p = String(iso).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function addD(s, n) { var d = pd(s); d.setDate(d.getDate() + n); return iso(d); }
function fd(s) { var d = pd(s); return d ? ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear() : ''; }
function fds(s) { var d = pd(s); return d ? ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) : ''; }
function diffDays(a, b) { return Math.round((pd(a) - pd(b)) / 864e5); }
function monday(s) { var d = pd(s), w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); }
function money(v) { if (v === '' || v === null || v === undefined) return ''; var n = +v; if (!isFinite(n)) return esc(v);
  return n.toLocaleString('pl-PL', { maximumFractionDigits: 2 }) + ' zł'; }
function phone(s) { var m = String(s || '').match(/(\+?\d[\d\s\-]{7,}\d)/); return m ? m[1].replace(/[\s\-]/g, '') : ''; }
function isAdmin() { return S.user && S.user.role === 'admin'; }
function isAndroid() { return /Android/i.test(navigator.userAgent); }
function isIOS() { return /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function navUrl(adres) { return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(adres) + '&travelmode=driving'; }
/** Adres albo wklejony link z Map Google / współrzędne → {href, link, label}. Z linku z pinezką (współrzędne) robi od razu trasę. */
function mapTarget(a) {
  a = String(a || '').trim();
  var c = a.match(/^(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/);
  if (c) return { href: navUrl(c[1] + ',' + c[2]), link: true, label: 'Pinezka ' + c[1] + ', ' + c[2] };
  if (!/^https?:\/\/\S+$/i.test(a)) return { href: navUrl(a), link: false, label: a };
  var name = '', m = a.match(/\/maps\/place\/([^\/@?]+)/);
  if (m) { try { name = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { name = m[1].replace(/\+/g, ' '); } }
  c = a.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || a.match(/[?&](?:q|query|destination|ll|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i) || a.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  return { href: c ? navUrl(c[1] + ',' + c[2]) : a, link: true, label: name || 'Pinezka z Map Google' };
}
/** Link otwierający kanał w aplikacji Pumble (Android: wprost aplikacja, inne – link, który telefon otwiera w aplikacji). */
function pumbleHref(ch) {

  if (ch && ch.link) u = ch.link;
  else if (ch && S.pumbleTpl) u = S.pumbleTpl.replace('{ch}', ch.id);
  else if (ch && S.pumbleWs) u = 'https://app.pumble.com/workspace/' + S.pumbleWs + '/' + ch.id;
  if (isAndroid()) return 'intent://' + u.replace(/^https:\/\//, '') + '#Intent;scheme=https;package=com.pumble;S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
  return u;
}

function stCls(s) { return 'st-' + slug(s); }

function toast(msg, err) {

// ------------------------------------------------------------------------------------------------ pamięć w telefonie (IndexedDB)
var IDB = null;
function idb() {
  if (IDB) return IDB;
  IDB = new Promise(function (res, rej) {
    try {
      var rq = indexedDB.open('etner', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error); };
    } catch (e) { rej(e); }
  });
  return IDB;
}
function idbDo(mode, fn) {
  return idb().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('kv', mode), st = tx.objectStore('kv'), r = fn(st);
      tx.oncomplete = function () { res(r && r.result); };
      tx.onerror = function () { rej(tx.error); };
      tx.onabort = function () { rej(tx.error); };
    });
  });
}
function idbGet(k) { return idbDo('readonly', function (st) { return st.get(k); }).catch(function () { return null; }); }
function idbPut(k, v) { return idbDo('readwrite', function (st) { return st.put(v, k); }).catch(function () { return null; }); }
function idbDel(k) { return idbDo('readwrite', function (st) { return st.delete(k); }).catch(function () { return null; }); }

// ------------------------------------------------------------------------------------------------ serwer
var inflight = 0;
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  inflight++; badge();
  var p = MODE === 'gas' ? gasCall(fn, args) : httpCall(fn, args);
  return p.then(function (r) { inflight--; S.offline = false; badge(); return r; },
                function (e) { inflight--; if (e.net) S.offline = true; badge(); throw e; });
}
function mkErr(m) {
  m = String(m || 'Błąd').replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '');
  var e = new Error(m);
  if (/NetworkError|HTTP 0|Failed to fetch|Load failed|timed? ?out|POWTORZ/i.test(m)) { e.net = true; e.message = 'Brak połączenia – spróbuję ponownie.'; }
  if (m.indexOf('BRAK_DOSTEPU') >= 0) { e.denied = true; noAccess(); }
  return e;
}
function gasCall(fn, args) {
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(mkErr((e && e.message) || e)); });
    r[fn].apply(r, [TOKEN].concat(args));
  });
}
function httpCall(fn, args) {
  if (!navigator.onLine) return Promise.reject(mkErr('NetworkError'));
  return fetch(CFG.api, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                          body: JSON.stringify({ fn: fn, token: TOKEN, args: args }) })
    .then(function (r) { if (!r.ok) throw mkErr('NetworkError HTTP ' + r.status); return r.json(); },
          function () { throw mkErr('NetworkError'); })
    .then(function (j) { if (!j || !j.ok) throw mkErr(j && j.error); return j.result; });
}
function fail(e) { toast(e && e.message ? e.message : String(e), true); }

function noAccess() {
  $('view').innerHTML = '<div class="loading"><div style="font-size:42px">🔒</div><div class="b">Brak dostępu</div>' +

    'o swój osobisty link do aplikacji ETNER.</div></div>';

}

function applyData(d) {
  S.v = d.v; S.user = d.user; S.lists = d.lists; S.jobs = d.jobs || []; S.leads = d.leads; S.hist = d.hist || {};
  S.schedule = d.schedule; S.areas = d.areas || { Z: [], L: [] }; S.today = d.today || S.today || todayLocal();

  S.checks = d.checks || []; S.buys = d.buys || []; S.crews = d.crews || {}; S.pumbleWs = d.pumbleWs || ''; S.pumbleTpl = d.pumbleTpl || '';
  S.pwaUrl = d.pwaUrl || ''; S.vapid = d.vapid || '';
  if (!S.areas.K) S.areas.K = [];
  S._jm = null;
  S.outbox.forEach(function (op) { applyOp(op); });
}
function snapshotOf() {
  return { v: S.v, user: S.user, lists: S.lists, jobs: S.jobs, leads: S.leads, hist: S.hist, schedule: S.schedule, areas: S.areas,
           today: S.today, pumble: S.pumble, test: S.test, version: S.serverVersion, checks: S.checks, buys: S.buys, crews: S.crews,
           pumbleWs: S.pumbleWs, pumbleTpl: S.pumbleTpl, pwaUrl: S.pwaUrl, vapid: S.vapid };
}
function saveData(d) {
  clearTimeout(persistSoon.tm);
  if (!lsSet('data_' + KEY, d)) { try { localStorage.removeItem(LSK + 'data_' + KEY); } catch (e) {} }
}
function persistSoon() {
  clearTimeout(persistSoon.tm);
  persistSoon.tm = setTimeout(function () {
    if (S.outbox.length || !S.v || !S.user) return;          // zapisuję tylko stan potwierdzony przez serwer
    if (!lsSet('data_' + KEY, snapshotOf())) { try { localStorage.removeItem(LSK + 'data_' + KEY); } catch (e) {} }
  }, 800);
}
function sync(force) {
  if (S.denied) return Promise.resolve();
  if (S.syncing) { S.syncAgain = S.syncAgain || (force ? 'force' : 'yes'); return S.syncing; }
  if (Q.running && !force && S.user) { S.needSync = true; return Promise.resolve(); }
  S.syncing = api('apiSync', force ? null : S.v, !!force).then(function (d) {
    if (d.today) S.today = d.today;
    S.lastSync = Date.now();
    if (d.same) return;
    if (Q.running && S.user) { S.needSync = true; return; }   // zapis w toku – dane i tak zaraz się zmienią
    var first = !S.user;
    saveData(d);                                          // dane z serwera od razu do pamięci telefonu
    applyData(d);
    setTimeout(prefetch, 300);
    if (first) initRoute(); else rerender();
    if (force) toast('Dane odświeżone.');
  }).catch(function (e) {
    if (e.denied) return;
    if (!S.user) loadError(e); else if (!e.net) toast(e.message, true);
  }).then(function () {
    S.syncing = null; badge();
    if (S.syncAgain) { var f = S.syncAgain === 'force'; S.syncAgain = null; sync(f); }
  });
  badge();
  return S.syncing;
}
function loadError(e) {
  $('view').innerHTML = '<div class="loading"><div style="font-size:40px">⚠️</div><div class="b">Nie udało się wczytać danych</div>' +
    '<div class="small" style="max-width:420px;text-align:center">' + esc(e.message) + '</div><button class="btn pri" data-act="retry">Spróbuj ponownie</button></div>';
}
/** Wynik zapisu: jeśli serwer miał tę samą wersję co aplikacja przed zapisem, aplikacja jest aktualna. */
function adopt(res) {
  if (!res) return;
  if (res.big) { S.needSync = true; S.v = null; return; }
  if (res.v && res.prev && res.prev === S.v && !res.dup) S.v = res.v;
  else if (res.v) S.needSync = true;
}

// ------------------------------------------------------------------------------------------------ kolejka zapisów (działa też bez zasięgu)
var Q = { running: false, fail: 0 };
var OP_LABEL = { sched: 'Harmonogram', job: 'Zlecenie', lead: 'Lead', contact: 'Kontakt', tojob: 'Zlecenie z leada', diary: 'Wpis',
                 ddel: 'Usuwanie wpisu', psend: 'Wiadomość Pumble', chk_add: 'Lista do zabrania', chk_tog: 'Lista do zabrania',
                 chk_del: 'Lista do zabrania', buy_add: 'Zakupy', buy_set: 'Zakupy', buy_del: 'Zakupy' };
/** Po zapisie nowej pozycji: tymczasowy numer w kolejnych zapisach z kolejki zamieniony na prawdziwy. */
function remapOutbox(tmp, real) {
  if (!tmp || tmp === real) return;
  S.outbox.forEach(function (op) { if (op.p && op.p.id === tmp) op.p.id = real; });
  saveOutbox();
}
function saveOutbox() { return idbPut('outbox_' + KEY, S.outbox.map(function (o) { var c = {}; for (var k in o) if (k !== 'st') c[k] = o[k]; return c; })); }
function enqueue(type, p) {
  var op = { id: uid(), type: type, p: p, t: Date.now() };
  S.outbox.push(op);
  saveOutbox();
  applyOp(op);
  badge();
  pump();
  return op;
}
function pump() {
  if (Q.running || S.denied) return;
  if (!S.outbox.length) { afterDrain(); return; }
  var op = S.outbox[0];
  Q.running = true; op.st = 'send'; badge();
  sendOp(op).then(function () {
    S.outbox.shift(); Q.running = false; Q.fail = 0;
    saveOutbox(); badge(); rerender(); pump();
  }, function (e) {
    Q.running = false;
    if (e.net && !e.denied) {                                 // bez zasięgu – spróbuję później, kolejność zostaje
      op.st = 'wait'; Q.fail++; badge(); rerenderDetail();
      clearTimeout(Q.tm); Q.tm = setTimeout(pump, Math.min(60000, 4000 * Q.fail));
      return;
    }
    S.outbox.shift(); saveOutbox();
    toast((OP_LABEL[op.type] || 'Zapis') + ': ' + e.message, true);
    opFailed(op);
    S.v = null; S.needSync = true;
    badge(); pump();
  });
}
function afterDrain() {
  if (S.needSync || !S.v) { S.needSync = false; sync(); }
  persistSoon();
}
function opCall(op, fn, args, sub) { return api('apiOp', op.id + (sub || ''), fn, args); }

/** Zmiana od razu widoczna w aplikacji (zanim serwer potwierdzi). Wywoływana też po wczytaniu świeżych danych. */
function applyOp(op) {
  var p = op.p;
  if (op.type === 'sched') { schedApply(p); calcJobDays(S.jobs); S._jm = null; }
  else if (op.type === 'job') jobApply(p.job, p.tmpId);
  else if (op.type === 'lead') leadApply(p.lead, p.tmpId);
  else if (op.type === 'contact') contactApply(p);
  else if (op.type === 'chk_add') {
    if (!byId(S.checks, p.tmpId)) S.checks.push({ id: p.tmpId, crew: p.crew, day: p.day, text: p.text, by: S.user.name, at: '', done: false, _tmp: true });
  }
  else if (op.type === 'chk_tog') { var c = byId(S.checks, p.id); if (c) { c.done = p.done; c.doneBy = p.done ? S.user.name : ''; } }
  else if (op.type === 'chk_del') S.checks = S.checks.filter(function (x) { return x.id !== p.id; });
  else if (op.type === 'buy_add') {
    if (!byId(S.buys, p.tmpId)) S.buys.push({ id: p.tmpId, co: p.co, uwagi: p.uwagi || '', status: (S.lists.statusK || [])[0] || 'Do kupienia', by: S.user.name,
      sklep: '', grupa: '', kwota: '', sec: '', arch: false, zamk: '', _tmp: true });
  }
  else if (op.type === 'buy_set') {
    var bq = byId(S.buys, p.id);
    if (bq) { Object.keys(p.patch).forEach(function (k) { bq[k] = p.patch[k]; }); place(bq, S.areas.K); }
  }
  else if (op.type === 'buy_del') S.buys = S.buys.filter(function (x) { return x.id !== p.id; });
  else if (op.type === 'tojob') {
    jobApply(p.job, p.tmpId);
    var j = byId(S.jobs, p.tmpId); if (j) j.leadId = p.leadId;
    if (p.accept) { var l = byId(S.leads, p.leadId); if (l) { l.status = S.lists.statusL[3] || 'Przyjęta'; place(l, S.areas.L); } }
  }
}
function sendOp(op) {
  var p = op.p;
  if (op.type === 'sched') return opCall(op, 'apiScheduleSet', [p]).then(function (r) {
    if (r && r.days) { var m = dayMap(); r.days.forEach(function (d) { var x = m[d.d]; if (x) { x.cells = d.cells; x.uw = d.uw; } }); }
    calcJobDays(S.jobs); S._jm = null; adopt(r);
  });
  if (op.type === 'job') return opCall(op, 'apiJobSave', [p.job]).then(function (r) { if (r && r.job) putRecord('jobs', p.tmpId || r.id, r.job, 'zl'); adopt(r); });
  if (op.type === 'lead') return opCall(op, 'apiLeadSave', [p.lead]).then(function (r) { if (r && r.lead) putRecord('leads', p.tmpId || r.id, r.lead, 'ld'); adopt(r); });
  if (op.type === 'contact') return opCall(op, 'apiLeadContact', [p.id, p.note, p.next]).then(function (r) {
    if (r && r.lead) { putRecord('leads', p.id, r.lead, 'ld'); S.hist[p.id] = r.kontakty; }
    adopt(r);
  });
  if (op.type === 'tojob') return opCall(op, 'apiLeadToJob', [p.leadId, p.job, p.accept]).then(function (r) {
    if (r && r.job) putRecord('jobs', p.tmpId, r.job, 'zl');
    if (r && r.lead) putRecord('leads', p.leadId, r.lead, 'ld');
    delete S.diaryAt[p.leadId];
    adopt(r);
  });
  if (op.type === 'diary') return sendDiary(op);
  if (op.type === 'ddel') return opCall(op, 'apiDiaryDelete', [p.id, p.view]).then(function (r) {
    if (r && r.diary) { S.diary[p.view] = r.diary; S.diaryAt[p.view] = Date.now(); }
    setCount(p.obj, r && r.n);
    adopt(r);
  });
  if (op.type === 'psend') return opCall(op, 'apiPumbleSend', [p.obj, p.text]).then(function (r) {
    if (r && r.messages) S.pumbleMsgs[p.obj] = r;
    delete S.tomorrowAt;
  });
  if (op.type === 'chk_add') return opCall(op, 'apiCheckAdd', [p.crew, p.day, p.text]).then(function (r) {
    if (r && r.item) { S.checks = S.checks.filter(function (x) { return x.id !== p.tmpId && x.id !== r.item.id; }).concat([r.item]); remapOutbox(p.tmpId, r.item.id); }
    adopt(r);
  });
  if (op.type === 'chk_tog') return opCall(op, 'apiCheckToggle', [p.id, p.done]).then(function (r) {
    if (r && r.item) S.checks = S.checks.map(function (x) { return x.id === r.item.id ? r.item : x; });
    adopt(r);
  });
  if (op.type === 'chk_del') return opCall(op, 'apiCheckDelete', [p.id]).then(adopt);
  if (op.type === 'buy_add') return opCall(op, 'apiBuyAdd', [{ co: p.co, uwagi: p.uwagi }]).then(function (r) {
    if (r && r.item) { S.buys = S.buys.filter(function (x) { return x.id !== p.tmpId && x.id !== r.item.id; }).concat([r.item]); remapOutbox(p.tmpId, r.item.id); }
    adopt(r);
  });
  if (op.type === 'buy_set') return opCall(op, 'apiBuySet', [p.id, p.patch]).then(function (r) {
    if (r && r.item) S.buys = S.buys.map(function (x) { return x.id === r.item.id ? r.item : x; });
    adopt(r);

/** Dzień listy: przed 12:00 – dziś, od 12:00 – następny dzień (dni wolne bez wpisów ekipy pomijane). */
function jutroDay(crew) {
  var today = S.today || todayLocal(), d = new Date().getHours() < 12 ? today : addD(today, 1), dm = dayMap(), cols = crewCols(crew);
  for (var i = 0; i < 7; i++) {
    var x = dm[d];
    if (!x || x.wd === 1 || cols.some(function (c) { return x.cells[c]; })) break;
    d = addD(d, 1);
  }
  return d;
}
function dayName(d) { return d === S.today ? 'dziś' : (d === addD(S.today, 1) ? 'jutro' : DOWL[pd(d).getDay()]); }
function allCrews() {
  var crews = Object.keys(S.crews || {});
  (S.lists.ekipy || []).forEach(function (e) { if (norm(e) !== 'mieszane' && crews.indexOf(e) < 0) crews.push(e); });
  return crews;
}
function myCrew() { return isAdmin() ? (S.jutroCrew || (S.user.ekipa || '') || allCrews()[0] || '') : (S.user.ekipa || ''); }
function crewCols(crew) {

  if (!names.length && S.user.person && (!crew || crew === S.user.ekipa)) names = [norm(S.user.person)];
  (S.schedule.persons || []).forEach(function (p) { if (names.indexOf(norm(p.name)) >= 0) cols.push(p.c); });
  return cols;
}
function crewChecks(crew, day) { return (S.checks || []).filter(function (c) { return c.crew === crew && c.day === day; }); }
function jutroOpen() { var crew = myCrew(); if (!crew || !S.schedule) return 0; return crewChecks(crew, jutroDay(crew)).filter(function (c) { return !c.done; }).length; }
function jutroJobs(crew, day) {
  var d = dayMap()[day], out = [], who = [];

  crewCols(crew).forEach(function (c) {
    var t = d.cells[c], p = (S.schedule.persons || []).filter(function (x) { return x.c === c; })[0];
    if (!t) return;

});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { if (S.viewer) ACT.vclose(); else if (S.sheetOpen) closeSheet(); }
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'p_text') pumbleSend(S.route.split('/')[1]);
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'chk_text') checkAdd();
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'buy_co') buyAdd();
  if (S.viewer && ev.key === 'ArrowLeft') ACT.vprev();
  if (S.viewer && ev.key === 'ArrowRight') ACT.vnext();
});
document.addEventListener('focusout', function () { setTimeout(function () { if (S.dirty) rerender(); }, 800); });
var rsz = null;
function bp() { return wide() ? 2 : (midW() ? 1 : 0); }
window.addEventListener('resize', function () {
  clearTimeout(rsz);
  rsz = setTimeout(function () { var b = bp(); if (b !== S.bp && !S.sheetOpen && S.user) { S.bp = b; keepInputs(render); } }, 250);
});
window.addEventListener('online', function () { S.offline = false; Q.fail = 0; badge(); pump(); sync(); });
window.addEventListener('offline', function () { S.offline = true; badge(); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden || !S.user) return;
  if (S.lastSync && Date.now() - S.lastSync > 15000) sync();
  pump();
});
setInterval(function () { if (!document.hidden && S.user && !S.outbox.length && (!S.lastSync || Date.now() - S.lastSync > 45000)) sync(); }, 15000);
setInterval(function () {                                    // o 12:00 lista „Na jutro” przechodzi na kolejny dzień
  var hr = new Date().getHours() < 12;
  if (S.jutroHalf !== undefined && S.jutroHalf !== hr && S.route === 'jutro') rerender();
  S.jutroHalf = hr;
}, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (e) {   // klik w powiadomienie
  if (e.data && e.data.go && S.user) go(e.data.go);
});

// ------------------------------------------------------------------------------------------------ start
function initRoute() {
  S.week = S.today;
  S.bp = bp();
  if (MODE === 'gas') {
    try {
      google.script.history.setChangeHandler(function (e) { var r = (e.state && e.state.r) || (e.location && e.location.hash) || 'harm'; go(r, true); });
      google.script.url.getLocation(function (loc) { if (loc && loc.hash) go(loc.hash, true); else render(); });
    } catch (e) { render(); }
  } else {
    window.addEventListener('popstate', function (e) { go((e.state && e.state.r) || location.hash.slice(1) || 'harm', true); });
    var h = location.hash.slice(1);
    if (h) go(h, true); else render();
  }
  badge();
}
function askLink() {
  $('view').innerHTML = '<div class="loading" style="padding:20px"><div style="font-size:40px">🔑</div><div class="b">Wklej swój link do aplikacji</div>' +
    '<div class="small" style="max-width:360px;text-align:center">Osobisty link dostajesz od administratora (kończy się na „?u=…”). Wystarczy raz – aplikacja go zapamięta.</div>' +
    '<input id="lk" class="search" style="max-width:420px" placeholder="https://…?u=…"><button class="btn pri" data-act="savelink">Zapisz</button></div>';
}
ACT.savelink = function () {
  var v = ($('lk').value || '').trim(), m = v.match(/[?&]u=([A-Za-z0-9]+)/) || v.match(/^([A-Za-z0-9]{20,})$/);
  if (!m) return toast('To nie wygląda na link do aplikacji ETNER.', true);
  lsSet('token', m[1]);
  location.replace(location.pathname + '?u=' + m[1]);
};
function registerSW() {
  if (MODE !== 'pwa' || !('serviceWorker' in navigator)) return;
  try {
    var had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(function () {});
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!had) return;                                     // pierwsza instalacja – nic nie przeładowuję
      if (!S.outbox.length && !S.sheetOpen && !Q.running) location.reload();
      else toast('Jest nowa wersja aplikacji – otwórz ją ponownie, gdy skończysz.');
    });
  } catch (e) {}
}
function start() {
  registerSW();
  if (MODE === 'pwa' && TOKEN) idbPut('cfg', { api: CFG.api, token: TOKEN, base: location.pathname + location.search });
  idbGet('diary_' + KEY).then(function (dz) { if (dz && typeof dz === 'object') Object.keys(dz).forEach(function (k) { if (!S.diary[k]) S.diary[k] = dz[k]; }); });
  if (!TOKEN && MODE === 'pwa') { askLink(); return; }
  if (!TOKEN || BOOT.denied) { noAccess(); return; }
  if (MODE === 'pwa' && !CFG.api) { loadError(new Error('Brak adresu serwera w config.js.')); return; }
  var ob = idbGet('outbox_' + KEY), timeout = new Promise(function (res) { setTimeout(res, 1500); });
  Promise.race([ob, timeout]).then(function (list) {
    S.outbox = Array.isArray(list) ? list : [];
    var d = BOOT.data || lsGet('data_' + KEY);
    if (d && d.user) {
      applyData(d);
      if (!BOOT.data) S.v = d.v;
      initRoute();
      if (BOOT.data && !BOOT.stale) { S.lastSync = Date.now(); persistSoon(); } else sync();
    } else sync();
    pump();
    setTimeout(function () { if (S.user) { prefetch(); pushKeepAlive(); } }, 1500);
  });
}
start();
})();
</script>
</body>
</html>
